name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE (not merge with) the workflow-level block,
    # so contents: write must be repeated here. packages: write is scoped to
    # this job only: goreleaser pushes the OCI images to ghcr.io (Stage 12);
    # npm-publish never touches GitHub Packages.
    permissions:
      contents: write
      packages: write
    # Action majors are floated (`@v7`), not SHA-pinned: this is a solo repo
    # publishing from a tag we cut by hand, so a compromised-tag window is a
    # worse trade than never noticing a deprecation again. All actions below sit
    # on Node 24 runtimes, which need runner >= v2.327.1 — satisfied by
    # GitHub-hosted `ubuntu-latest`, but a self-hosted runner would have to be
    # updated first.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Kept in lockstep with the `go` directive in go.mod (currently 1.26.7)
      # and with the Go version in the Glama.ai build spec. setup-go v6 changed
      # toolchain selection, which only bites when go.mod declares a `toolchain`
      # line different from the pinned version — we have none, the versions
      # match exactly.
      #
      # Bumped 2026-08-20 from 1.23.4: govulncheck found 34 reachable stdlib
      # vulnerabilities (net/http request smuggling, crypto/x509 IPv6-zone
      # constraint bypass, and others with real call traces into
      # internal/mcp/codec.go, internal/upstream/http.go,
      # internal/transport/http.go) — none had a fix released in the 1.23.x
      # line because it had already aged out of Go's security-support window
      # (last two majors only). Verified clean (`govulncheck ./...` reports
      # "No vulnerabilities found") and `go build`/`go test -race ./...` green
      # on 1.26.7 before this bump, with zero source changes required.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"

      # qemu + buildx let goreleaser build the linux/arm64 image on the amd64
      # runner; the login lets it push both images and the multi-arch manifests
      # to ghcr.io (see `dockers:` / `docker_manifests:` in .goreleaser.yaml).
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser-action v7 is the Node 24 / ESM rebuild; the goreleaser CLI
      # version it installs is a separate axis and stays on `~> v2`.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    # The npm wrapper (npm/) has no binaries of its own: its install.js
    # downloads the release archives + SHA256SUMS that goreleaser just
    # uploaded, so publishing only makes sense after that job succeeds.
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # setup-node writes an .npmrc that reads the token from
          # NODE_AUTH_TOKEN when registry-url is set.
          registry-url: "https://registry.npmjs.org"
          # setup-node v5 added automatic dependency caching, keyed off a
          # `packageManager` field in package.json and a lockfile. npm/ has
          # neither (it is a wrapper with one runtime dep: none), so the cache
          # would not engage today — disabled explicitly so that adding a
          # `packageManager` field later cannot silently turn on a cache that
          # then fails looking for a lockfile we do not keep.
          package-manager-cache: false

      # package.json carries the placeholder 0.0.0-dev; stamp the tag's version
      # (without the v prefix) so install.js downloads the matching release.
      - name: Stamp package version from tag
        working-directory: npm
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      # Until the secret is provisioned, skip publishing instead of failing
      # the release: the binaries and OCI images are already out by this point.
      - name: Check NPM_TOKEN configured
        id: npm_token_check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set — skipping npm publish. Create it in repo settings (npm automation token) to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm_token_check.outputs.skip != 'true'
        working-directory: npm
        env:
          # NPM_TOKEN is a repository secret that must be created manually in
          # GitHub repo settings (an npm automation token with publish rights
          # for the `aimcpgate` package). It is NOT provisioned by this repo.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
