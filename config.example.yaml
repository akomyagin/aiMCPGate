# aiMCPGate example configuration.
#
# Secrets (tokens) are referenced with ${ENV_VAR} and resolved from the
# environment / a local .env at load time — never commit real secrets here.
#
# UNKNOWN KEYS ARE A STARTUP ERROR. Since v0.5.0 the config is parsed strictly:
# a misspelled or unrecognized key stops the gateway, naming the key and its
# line number, instead of being silently ignored. (Previously `enabld: false`
# left the upstream ENABLED, with nothing anywhere saying why.) This includes
# custom "x-" scratch keys at the top level — there is no escape hatch. To share
# a block between upstreams, anchor it on the FIRST real upstream and merge it
# into the others; anchors and merge keys keep working under strict parsing:
#
#   upstreams:
#     - name: first
#       command: some-server
#       env: &common
#         REGION: eu
#     - name: second
#       command: other-server
#       env:
#         <<: *common
#         REGION: us

# Client-facing transport: how a client (Claude Code, Cursor, ...) reaches the
# gateway. "stdio" (Phase 1) launches the gateway as a subprocess; "http" (Phase 2)
# exposes a Streamable HTTP endpoint at http://<listen_addr>/mcp.
transport: stdio            # stdio | http
# Loopback-only by default. To serve over the network set a routable address
# AND set auth_token so the endpoint is not open to the whole LAN.
listen_addr: "127.0.0.1:28080" # only used when transport: http
# auth_token protects the HTTP endpoint: every request must carry
# "Authorization: Bearer <token>". Use ${ENV_VAR} — never commit the value.
# Omit (or leave empty) for loopback-only deployments where network auth is
# unnecessary.
# auth_token: ${AIMCPGATE_TOKEN}

# Where the JSON-lines journal is written. It holds BOTH tool calls and
# operator events (an upstream that failed to start or was given up on, dropped
# notifications, catalog collisions, a result max_result_bytes could not
# truncate); `mcp-gate logs` shows both, `mcp-gate logs --events` shows only the
# events. `mcp-gate logs --file <this>` reads it back.
#
# SET THIS. Empty → the journal goes to stderr, and in stdio mode stderr belongs
# to the MCP client, where the operator never sees it — the events would be
# written to nowhere useful. Relative paths (like this one) resolve against THIS
# config file's directory, not the cwd mcp-gate was launched from — so serve can
# be run from anywhere and still find its files.
log_file: ./logs/calls.jsonl
log_level: info             # debug | info | warn | error

# OPT-IN payload debug log — OFF by default (empty). When set, writes the raw
# arguments AND results of every tool call as JSON lines to this file. This is a
# DEBUG-ONLY aid: those bodies can contain secrets, so NEVER leave it enabled in
# production. It is a SEPARATE file from log_file (which stays metadata-only,
# with no arguments) and MUST NOT equal log_file. Relative paths resolve against
# this config file's directory, same as log_file. Uncomment to enable:
# debug_payload_log: ./logs/payloads.jsonl
call_timeout: 30s           # bounds one upstream request (handshake/list/call)

# Call limits (Round 6) — all optional, all hot-reloadable via SIGHUP without
# restarting any upstream process.
#
# rate_limit: a token bucket applied to forwarded tools/call requests, PER
# upstream (the global block is a default each upstream's own bucket is built
# from — not one shared budget). rps = tokens refilled per second; burst = how
# many calls may fire back-to-back (0 is treated as 1). Waiting for a token
# respects the client's own deadline/cancellation.
# rate_limit:
#   rps: 5
#   burst: 2
#
# max_result_bytes: opt-in truncation of oversized TEXTUAL tool results before
# they reach the client (token protection). Text content blocks are cut to
# bring the result close to this many bytes and a
# "[truncated by mcp-gate: ...]" marker is appended; results without text
# content (images, unknown shapes) pass through unchanged. 0 = unlimited (the
# default).
#
# Note the asymmetry: a NON-TEXT oversized result reaches the client whole, the
# limit simply does not apply to it (mangling an unknown shape would break the
# gateway's transparency contract). That is not silent any more — the gateway
# writes a `result_truncation_skipped` operator event into log_file naming the
# upstream, the tool and the size, so `mcp-gate logs --events` shows which calls
# escaped the limit.
# max_result_bytes: 65536

# Catalog presentation (Round 8) — both optional, hot-reloadable via SIGHUP.
#
# catalog_mode: "normal" (or omitted) exposes every namespaced upstream tool in
# tools/list, as always. "lazy" enables progressive tool disclosure: the client
# sees exactly THREE gateway meta-tools — gate_search_tools(query),
# gate_describe(name), gate_call(name, arguments) — and discovers/invokes the
# real catalog through them on demand, keeping the client's tool list (and its
# token cost) tiny however many upstreams are aggregated. Direct calls to
# namespaced tool names keep working in lazy mode.
# catalog_mode: lazy
#
# page_size: opt-in pagination of tools/list — pages of at most this many tools
# linked by an opaque nextCursor (MCP pagination). 0 / omitted = the whole
# catalog in one response. PRECEDENCE: ignored when catalog_mode is "lazy" (a
# fixed list of three meta-tools never paginates).
# page_size: 50

# Auto-restart policy for stdio upstreams whose child process dies while the
# gateway runs (a single GLOBAL policy — every upstream restart replays the exact
# config it was first launched with). HTTP upstreams have no process to restart.
# Defaults if omitted: enabled, 1s→30s exponential backoff, 5 attempts.
# restart:
#   enabled: true
#   initial_backoff: 1s
#   max_backoff: 30s
#   max_attempts: 5           # 0 = retry forever

# `mcp-gate skill` prints a built-in deployment-independent guide by default.
# Set this to override with your own file (org policy notes, translation, ...);
# `mcp-gate skill` with no config gives you the default text as a starting point.
# skill_file: ./skill.md

# Every upstream below writes `enabled` out explicitly — clearer in an example.
# Defaults if omitted: enabled. Only an explicit `enabled: false` keeps an
# upstream out of the gateway (it is then skipped by serve, doctor and the
# aggregated catalog alike) — a valueless `enabled:` counts as omitted, so
# commenting the value out does NOT disable the upstream.
upstreams:
  # stdio upstream: a local MCP server launched as a child process.
  - name: filesystem                       # ^[a-zA-Z0-9_-]+$ (namespacing)
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/home/user"]
    enabled: true

  - name: github
    command: github-mcp-server
    env:
      GITHUB_TOKEN: ${GITHUB_TOKEN}         # from the environment, not hardcoded
    enabled: true
    # Optional per-upstream tool filter/rename (all keys are the upstream's
    # ORIGINAL tool names). allow non-empty → only those tools; deny is always
    # subtracted (an extra safety barrier, not a replacement for auth); rename
    # maps a surviving tool to its client-facing name — unrenamed tools keep
    # the default "<upstream>__<tool>". Client-facing names must be unique
    # across the whole config. Editable at runtime via SIGHUP without
    # restarting the upstream process.
    #
    # Token optimization (opt-in): strip_annotations / strip_output_schema drop
    # those heavyweight catalog fields; max_description truncates descriptions
    # to N characters (runes) with a trailing "…" (0 = unlimited); describe
    # replaces a tool's description wholesale (keyed by ORIGINAL name, like
    # rename) and is never re-truncated by max_description.
    # tools:
    #   allow: ["search_repositories", "get_issue", "create_issue"]
    #   deny: ["create_issue"]
    #   rename:
    #     search_repositories: "gh_search"
    #   strip_annotations: true
    #   strip_output_schema: true
    #   max_description: 200
    #   describe:
    #     get_issue: "Fetch one GitHub issue by number."
    #
    # Per-upstream call limits (Round 6) — each overrides its global
    # counterpart for THIS upstream only; all hot-reloadable via SIGHUP with no
    # process restart:
    #   rate_limit — overrides the global bucket parameters (rps: 0 disables
    #     rate limiting for this upstream even when a global limit is set);
    #   max_concurrent — cap on simultaneous in-flight tools/call requests to
    #     this upstream (no global counterpart; 0/omitted = unlimited);
    #   max_result_bytes — overrides the global cap (an explicit 0 disables it
    #     for this upstream);
    #   call_timeout — overrides the global call_timeout for this upstream.
    # rate_limit:
    #   rps: 1
    #   burst: 1
    # max_concurrent: 4
    # max_result_bytes: 32768
    # call_timeout: 120s

  # http upstream (Phase 2): an already-running MCP server reached over
  # Streamable HTTP. Set `url` instead of `command` (exactly one of the two).
  # `kind` is optional — it is inferred as http when a url is present.
  - name: remote
    url: https://mcp.example.com/mcp
    headers:
      Authorization: "Bearer ${REMOTE_MCP_TOKEN}"   # secret, never logged
    enabled: true
