# goreleaser v2 configuration for aiMCPGate.
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod download
    # Shell completions shipped inside every release archive (Round 10). They
    # are generated ONCE here, before the builds, by running the source tree on
    # the CI host — the cross-compiled darwin/windows artifacts could not run
    # there, so a per-build post hook would not work. Hooks do not go through a
    # shell, hence the explicit `sh -c` for the output redirection.
    - mkdir -p completions
    - sh -c "go run ./cmd completion bash > completions/mcp-gate.bash"
    - sh -c "go run ./cmd completion zsh > completions/_mcp-gate"
    - sh -c "go run ./cmd completion fish > completions/mcp-gate.fish"

builds:
  - id: mcp-gate
    main: ./cmd
    binary: mcp-gate
    # modernc.org's pure-Go stdlib deps aside, aiMCPGate has no CGO dependency at
    # all (no SQLite here) — CGO_ENABLED=0 is still stated explicitly so cross
    # compilation to darwin/windows never silently depends on a C toolchain.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: mcp-gate
    name_template: "mcp-gate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Setting `files` replaces goreleaser's implicit LICENSE*/README* globs, so
    # they are restated explicitly alongside the generated shell completions.
    files:
      - LICENSE
      - README.md
      - README_RU.md
      - completions/*

# OCI images for the MCP registry / Glama.ai (Stage 12): one image per arch
# pushed to ghcr.io, then stitched into multi-arch manifests below. The
# workflow (.github/workflows/release.yml) logs docker in to ghcr.io and sets
# up buildx/qemu before goreleaser runs.
dockers:
  - id: mcp-gate-amd64
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    extra_files:
      - demo.config.yaml
    image_templates:
      - "ghcr.io/akomyagin/aimcpgate:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/akomyagin/aiMCPGate"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
  - id: mcp-gate-arm64
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    extra_files:
      - demo.config.yaml
    image_templates:
      - "ghcr.io/akomyagin/aimcpgate:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/akomyagin/aiMCPGate"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"

docker_manifests:
  - name_template: "ghcr.io/akomyagin/aimcpgate:{{ .Version }}"
    image_templates:
      - "ghcr.io/akomyagin/aimcpgate:{{ .Version }}-amd64"
      - "ghcr.io/akomyagin/aimcpgate:{{ .Version }}-arm64"
  - name_template: "ghcr.io/akomyagin/aimcpgate:latest"
    image_templates:
      - "ghcr.io/akomyagin/aimcpgate:{{ .Version }}-amd64"
      - "ghcr.io/akomyagin/aimcpgate:{{ .Version }}-arm64"

# Homebrew tap (macOS/Linux: `brew install akomyagin/tap/mcp-gate`).
#
# TODO(dist): публикация выключена (skip_upload: true), пока не выполнены два
# РУЧНЫХ шага вне этого репозитория:
#   1. создать репозиторий github.com/akomyagin/homebrew-tap;
#   2. добавить secret HOMEBREW_TAP_GITHUB_TOKEN (PAT с правом push в этот
#      репозиторий) в GitHub Actions этого репо и пробросить его в env шага
#      goreleaser в .github/workflows/release.yml.
# После этого убрать skip_upload. envOrDefault оставляет token пустым, а не
# роняет весь релиз template-ошибкой, пока секрета нет.
brews:
  - name: mcp-gate
    repository:
      owner: akomyagin
      name: homebrew-tap
      branch: main
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    directory: Formula
    homepage: https://github.com/akomyagin/aiMCPGate
    description: "MCP gateway/proxy: multiplexes tool calls across upstream MCP servers into one catalog."
    license: MIT
    commit_msg_template: "chore: brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    test: |
      system "#{bin}/mcp-gate", "version"
    skip_upload: true

# Scoop bucket (Windows: `scoop bucket add akomyagin https://github.com/akomyagin/scoop-bucket; scoop install mcp-gate`).
#
# TODO(dist): публикация выключена (skip_upload: true), пока не выполнены два
# РУЧНЫХ шага вне этого репозитория:
#   1. создать репозиторий github.com/akomyagin/scoop-bucket;
#   2. добавить secret SCOOP_BUCKET_GITHUB_TOKEN (PAT с правом push в этот
#      репозиторий) и пробросить его в env шага goreleaser в
#      .github/workflows/release.yml.
# После этого убрать skip_upload.
scoops:
  - name: mcp-gate
    repository:
      owner: akomyagin
      name: scoop-bucket
      branch: main
      token: '{{ envOrDefault "SCOOP_BUCKET_GITHUB_TOKEN" "" }}'
    directory: bucket
    homepage: https://github.com/akomyagin/aiMCPGate
    description: "MCP gateway/proxy: multiplexes tool calls across upstream MCP servers into one catalog."
    license: MIT
    commit_msg_template: "chore: scoop manifest update for {{ .ProjectName }} version {{ .Tag }}"
    skip_upload: true

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# SBOM (Software Bill of Materials) + cosign keyless signing (security
# brainstorm 2026-08-20, finding S4): SHA256SUMS alone sits on the same
# GitHub Release it is meant to verify — it protects against a corrupted
# download, not against a compromised publishing account/CI. Both mechanisms
# below are $0/мес and add no secrets to manage: cosign's KEYLESS mode signs
# using the GitHub Actions OIDC token as identity (sigstore's Fulcio/Rekor
# public-good instances), never a private key stored anywhere.
#
# One archive SBOM (SPDX JSON — syft's default output format when invoked
# this way, verified locally: `goreleaser release --snapshot --clean
# --skip=docker,publish,sign` produces spdxVersion "SPDX-2.3" documents, not
# CycloneDX) per release artifact — what's IN each downloadable binary/
# archive, for anyone doing dependency review before running it.
sboms:
  - id: archive
    artifacts: archive

# Sign the checksum file, not every archive individually: SHA256SUMS already
# covers every archive by hash, so one signature transitively vouches for all
# of them — goreleaser's own recommended pattern for this exact shape.
# "--yes" is required for cosign 2.x running non-interactively (no TTY to
# confirm the Rekor transparency-log write). The workflow
# (.github/workflows/release.yml) grants id-token: write so cosign can mint
# its OIDC identity; nothing here reads a stored key or secret.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Sign the ghcr.io multi-arch manifests directly in the registry (cosign
# `sign`, not `sign-blob` — the artifact is a remote image reference, not a
# local file). `all` covers all configured docker_manifests entries
# ({{ .Version }} AND latest) in one pass.
docker_signs:
  - cmd: cosign
    artifacts: all
    output: true
    args:
      - "sign"
      - "${artifact}"
      - "--yes"

changelog:
  use: github

release:
  github:
    owner: akomyagin
    name: aiMCPGate
